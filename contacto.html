<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><link rel="icon" href="img/favicon.svg"><title>Contáctenos | INNOVENTUS</title><meta name="description" content="Escribe a INNOVENTUS y agenda tu consulta legal virtual."></head><body>
<header id="site-header"></header><main>
<section class="ph"><div class="wrap"><h1>Contáctenos</h1><p>Cuéntanos tu situación y te responderemos para coordinar tu consulta virtual.</p></div></section>
<section><div class="wrap two" style="grid-template-columns:.8fr 1.2fr">
<div class="info"><div class="card"><b>Correo</b><a data-mail></a></div><div class="card"><b>Teléfono</b><a data-tel></a></div><div class="card"><b>Horario de atención</b>Lunes a viernes, 8:00 a. m. a 5:00 p. m.</div><div class="card"><b>Modalidad</b>Consultas por videollamada, teléfono o correo.</div><div class="card"><b>Síguenos en Instagram</b><a class="ig" data-ig="icon" target="_blank" rel="noopener" aria-label="Instagram de INNOVENTUS"></a></div></div>
<div><h2>Envíanos tu consulta</h2><form id="contact-form" novalidate style="margin-top:1.5rem">
<div class="row"><label>Nombre completo<input name="nombre" required autocomplete="name"></label><label>Correo electrónico<input name="correo" type="email" required autocomplete="email"></label></div>
<div class="row"><label>Teléfono<input name="telefono" type="tel" autocomplete="tel"></label><label>Área legal<select name="area" required><option value="">Selecciona una opción</option><option>Derecho corporativo</option><option>Contratos y cumplimiento</option><option>Propiedad intelectual</option><option>Derecho laboral</option><option>Civil y familia</option><option>Protección de datos</option><option>Otro</option></select></label></div>
<label>Cuéntanos tu caso<textarea name="mensaje" rows="5" required></textarea></label>
<label class="chk"><input type="checkbox" required> Acepto el tratamiento de mis datos para responder mi consulta.</label>
<button class="btn b1" type="submit" style="border:0;cursor:pointer;justify-self:start">Enviar consulta</button>
<p class="ok" id="form-ok" role="status"></p></form></div></div></section>
</main><footer id="site-footer"></footer><script src="js/main.js"></script></body></html>
